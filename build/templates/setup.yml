parameters:
  - name: NODE_VERSION
    type: string
    default: '22.x'

steps:
  - task: UseNode@1
    inputs:
      version: ${{ parameters.NODE_VERSION }}
    displayName: 'Install Node ${{ parameters.NODE_VERSION }}'
  - task: GoTool@0
    inputs:
      version: '1.26'
    displayName: 'Install Go'

  - bash: |
      set -exo pipefail
      git config --global core.longpaths true
    displayName: Enable git long paths

  - script: |
      COREPACK_ENABLE_STRICT=0 npm install -g corepack@latest
      corepack enable
      corepack enable npm
      corepack prepare pnpm@latest-11 --activate
    displayName: 'Setup pnpm'

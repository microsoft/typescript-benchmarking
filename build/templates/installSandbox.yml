parameters:
  - name: HOSTED_BENCHMARK
    type: boolean
    default: false

steps:
  - bash: |
      set -exo pipefail
      if ! command -v bwrap >/dev/null; then
        if command -v apt-get >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y bubblewrap
        elif command -v tdnf >/dev/null; then
          sudo tdnf install -y bubblewrap
        else
          echo "Unsupported package manager for bubblewrap installation" >&2
          exit 1
        fi
      fi

      # Ubuntu 24.04 blocks unprivileged user namespaces unless an AppArmor profile
      # allows them. Allow them for bubblewrap only, like Ubuntu's browser profiles.
      if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
        sudo tee /etc/apparmor.d/bwrap > /dev/null << 'EOF'
      abi <abi/4.0>,
      include <tunables/global>

      profile bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
      }
      EOF
        sudo apparmor_parser -r /etc/apparmor.d/bwrap
      fi
      bwrap --ro-bind / / --unshare-user --cap-drop ALL true
    target:
      commands: restricted
      settableVariables: none
    displayName: Install compiler sandbox

  - ${{ if parameters.HOSTED_BENCHMARK }}:
      # Match the scenario installer sandbox used by the GitHub-hosted scenario tests.
      # Only dependency installation uses gVisor; measured compilers use bubblewrap.
      - bash: |
          set -exo pipefail
          if command -v apt-get >/dev/null; then
            sudo apt-get install -y apt-transport-https ca-certificates curl gnupg acl
            curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y runsc
            RUNSC=/usr/bin/runsc
          elif command -v tdnf >/dev/null; then
            sudo tdnf install -y ca-certificates curl moby-engine moby-cli moby-buildx util-linux acl tar bzip2
            INSTALL_DIR=$(mktemp -d "${AGENT_TEMPDIRECTORY:?}/tsperf-runsc.XXXXXX")
            trap 'rm -f "$INSTALL_DIR/gvisor.tar.bz2"; rmdir "$INSTALL_DIR"' EXIT
            # Pin a release and its checksums. The "latest" tarball and checksum are
            # replaced separately, so they can disagree while a release is published.
            GVISOR_RELEASE=20261019.0
            case "$(uname -m)" in
              x86_64) GVISOR_SHA512=7cbc2aeeee809dcccfb40e612504a1b76f2c119790cee59e482f7b35428cccc4f71705e7e322442d07d1f7d29b5d9e72e31319fc3088d6dcbec9fc7c1f0d8881 ;;
              aarch64) GVISOR_SHA512=6b14b582cd3185169df54275eed8721d94c9b40e6cb1533d0d0c46573271c6d2d03db586ea1caac46a45e805797f00b115bead9fb93636a1ffa69f2430958977 ;;
              *) echo "Unsupported architecture for gVisor" >&2; exit 1 ;;
            esac
            URL="https://storage.googleapis.com/gvisor/releases/release/$GVISOR_RELEASE/$(uname -m)"
            curl -fsSL "$URL/gvisor.tar.bz2" -o "$INSTALL_DIR/gvisor.tar.bz2"
            echo "$GVISOR_SHA512  $INSTALL_DIR/gvisor.tar.bz2" | sha512sum --check
            sudo tar -xjf "$INSTALL_DIR/gvisor.tar.bz2" -C /usr/local/bin --no-same-owner --no-same-permissions
            RUNSC=/usr/local/bin/runsc
          else
            echo "Unsupported package manager for scenario sandbox installation" >&2
            exit 1
          fi
          docker buildx version
          sudo "$RUNSC" install
          sudo systemctl restart docker
          # New Docker installations do not grant the running agent access to its socket.
          if [ ! -w /var/run/docker.sock ]; then
            sudo setfacl -m "u:$(id -u):rw" /var/run/docker.sock
          fi
          docker info
        target:
          commands: restricted
          settableVariables: none
        displayName: Install scenario sandbox

      - bash: |
          set -eo pipefail
          CPUS=$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)
          test -n "$CPUS"
          taskset --cpu-list "$CPUS" true
          echo "##vso[task.setvariable variable=TSPERF_AGENT_BENCHMARK_CPUS;isReadOnly=true]$CPUS"
          echo "##vso[task.logissue type=warning]Using a hosted VM without dedicated CPU isolation or system tuning; results are provisional."
        target:
          commands: restricted
          settableVariables:
            - TSPERF_AGENT_BENCHMARK_CPUS
        displayName: Configure hosted benchmark CPUs

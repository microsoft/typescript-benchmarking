---
# bubblewrap sandboxes the compiler under test; see build/benchmark.yml.
# Desktop libraries follow VS Code's Linux dependencies:
# https://github.com/microsoft/vscode/blob/08631fab3a63e8439bec69dce08aa5cf95360d48/resources/linux/snap/snapcraft.yaml#L22
- name: Install packages
  ansible.builtin.apt:
    pkg: >-
      {{
        [
          'ripgrep',
          'unzip',
          'bubblewrap',
          'ca-certificates',
          'libcairo2',
          'libcanberra-gtk3-module',
          'libdrm2',
          'libgbm1',
          'libgl1',
          'libibus-1.0-5',
          'libnss3',
          'libpango-1.0-0',
          'libsecret-1-0',
          'libxcomposite1',
          'libxdamage1',
          'libxfixes3',
          'libxkbcommon0',
          'libxkbfile1',
          'libxrandr2',
          'libxss1',
          'locales-all',
          'packagekit-gtk3-module',
          'xdg-utils',
        ]
        + (
          [
            'libasound2t64',
            'libatk-bridge2.0-0t64',
            'libatk1.0-0t64',
            'libatspi2.0-0t64',
            'libcurl3t64-gnutls',
            'libcurl4t64',
            'libglib2.0-0t64',
            'libgtk-3-0t64',
          ]
          if ansible_distribution_version is version('24.04', '>=')
          else [
            'libasound2',
            'libatk-bridge2.0-0',
            'libatk1.0-0',
            'libatspi2.0-0',
            'libcurl3-gnutls',
            'libcurl3-nss',
            'libcurl4',
            'libglib2.0-0',
            'libgtk-3-0',
          ]
        )
      }}
  become: yes

- name: Probe bubblewrap user namespaces
  ansible.builtin.command: runuser -u nobody -- bwrap --ro-bind / / --unshare-user --cap-drop ALL true
  become: yes
  register: bwrap_probe
  failed_when: false
  changed_when: false
  check_mode: no

- name: Check AppArmor unprivileged user namespace restriction
  when: bwrap_probe.rc != 0
  ansible.builtin.slurp:
    src: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
  register: apparmor_restrict_userns
  failed_when: false
  check_mode: no

- name: Set bubblewrap AppArmor configuration fact
  ansible.builtin.set_fact:
    needs_bwrap_apparmor_profile: >-
      {{
        bwrap_probe.rc != 0
        and apparmor_restrict_userns.content is defined
        and (apparmor_restrict_userns.content | b64decode | trim) == '1'
      }}

- name: Install AppArmor tools for bubblewrap profile
  when: needs_bwrap_apparmor_profile
  ansible.builtin.apt:
    pkg:
      - apparmor
  become: yes

# Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; allow them for bubblewrap.
- name: Install AppArmor profile for bubblewrap
  when: needs_bwrap_apparmor_profile
  ansible.builtin.copy:
    dest: /etc/apparmor.d/bwrap
    owner: root
    group: root
    mode: '0644'
    content: |
      abi <abi/4.0>,
      include <tunables/global>

      profile bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
      }
  become: yes

- name: Load AppArmor profile for bubblewrap
  when: needs_bwrap_apparmor_profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/bwrap
  become: yes

- name: Verify bubblewrap user namespaces
  when: install_agent and not ansible_check_mode
  ansible.builtin.command: runuser -u nobody -- bwrap --ro-bind / / --unshare-user --cap-drop ALL true
  become: yes
  changed_when: false

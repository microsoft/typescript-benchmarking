---
- name: Configure kernel parameters for isolation
  ansible.builtin.copy:
    dest: /etc/default/grub.d/ts-perf.cfg
    owner: root
    group: root
    content: >
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT isolcpus=domain,managed_irq,{{ isolated_cpus }} rcu_nocbs={{ isolated_cpus }}"
  become: yes
  register: grub_cfg

- name: Update grub
  when: grub_cfg.changed
  ansible.builtin.shell: update-grub && touch /var/run/reboot-required
  become: yes

- name: Add legacy TSPERF_AGENT_BENCHMARK_CPU to .env
  ansible.builtin.lineinfile:
    path: '{{ agent_root }}/.env'
    regexp: '^TSPERF_AGENT_BENCHMARK_CPU='
    line: 'TSPERF_AGENT_BENCHMARK_CPU={{ benchmark_cpus }}'
  become: yes
  become_user: '{{ agent_user }}'
  register: legacy_env_line
  when: install_agent

- name: Add TSPERF_AGENT_BENCHMARK_CPUS to .env
  ansible.builtin.lineinfile:
    path: '{{ agent_root }}/.env'
    regexp: '^TSPERF_AGENT_BENCHMARK_CPUS='
    line: 'TSPERF_AGENT_BENCHMARK_CPUS={{ benchmark_cpus }}'
  become: yes
  become_user: '{{ agent_user }}'
  register: env_cpus_line
  when: install_agent

- name: Restart agent if .env edited
  ansible.builtin.shell: ./svc.sh stop && ./svc.sh start
  args:
    chdir: '{{ agent_root }}'
  become: yes
  when: svc_status_running and (legacy_env_line.changed or env_cpus_line.changed)
